name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: mcp-sec-audit-linux-x86_64
          - os: macos-latest
            asset: mcp-sec-audit-macos-aarch64
          - os: macos-13
            asset: mcp-sec-audit-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # Otherwise released binaries would report themselves as 0.1.0-SNAPSHOT.
      - name: Set version from tag
        run: >
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.17.1:set
          -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build native image
        run: mvn -B -Pnative -DskipTests package

      # A native binary can build cleanly and still die on a code path whose
      # reflection metadata is missing, so exercise it on real sources first.
      - name: Smoke test the binary
        run: ./target/mcp-sec-audit src --include-tests

      - name: Name the binary after its platform
        run: mv target/mcp-sec-audit ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
