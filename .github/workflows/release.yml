name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported Ubuntu: a binary linked against a newer glibc
          # refuses to start on older distributions
          - os: ubuntu-22.04
            asset: mcp-sec-audit-linux-x86_64
          - os: macos-latest
            asset: mcp-sec-audit-macos-aarch64
          - os: macos-15-intel
            asset: mcp-sec-audit-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # Otherwise released binaries would report themselves as 0.1.0-SNAPSHOT.
      - name: Set version from tag
        run: >
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.17.1:set
          -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build native image
        run: mvn -B -Pnative -DskipTests package

      # A native binary can build cleanly and still die on a code path whose
      # reflection metadata is missing, so exercise it on real sources first.
      - name: Smoke test the binary
        run: ./target/mcp-sec-audit src --include-tests

      - name: Name the binary after its platform
        run: mv target/mcp-sec-audit ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Platform-independent, so built once rather than on every native runner.
  jar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set version from tag
        run: >
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.17.1:set
          -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build the portable jar
        run: mvn -B -DskipTests package

      - name: Smoke test the jar
        run: java -jar target/*-all.jar src/main/java

      - name: Name it for the release
        run: mv target/*-all.jar mcp-sec-audit.jar

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-sec-audit-jar
          path: mcp-sec-audit.jar
          if-no-files-found: error

  release:
    needs: [build, jar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
